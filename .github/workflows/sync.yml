name: sync
# Mirrors every official Horizon launcher release here with the offline patch on
# top. Every half hour a watcher compares the official repository's newest
# `launcher@` tag against this repository's; when the official one is newer:
#
#   1. the watch job emits the official version,
#   2. sync-source checks out that tag's sources, cherry-picks everything after
#      PATCH_SHA on main (the offline patch and every offline change, and never
#      a past sync commit nor a plain-official restore) onto them with our
#      hunks winning (`-X theirs`); a conflicted file keeps the official side
#      and only the pick's own change is re-applied as a true 3-way apply,
#      which fails the sync loudly instead of blending a stale vintage
#      silently; then every path no offline commit owns is converged to the
#      official tag's exact content, our CI files and release-keys.txt line are
#      restored, the whole workspace is type-checked BEFORE anything is
#      committed or tagged, and only then main is pushed with its tag,
#   3. publish calls build.yml to build, sign and release that tag here.
#
# The launcher's self-update feed reads this repository (LAUNCHER_UPDATES_REPO
# in launcher/src/backend.rs), so its own Update button offers these patched
# builds and thereby keeps the offline patch — while game versions, downloads
# and Nightlies keep coming from the official repository as before.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

env:
  OFFICIAL_REPO: horizon-rust/horizon
  # The commit after which main is "the offline flavor": the last commit that
  # only carries sources we merged from official (never amend it). Everything
  # after it — the patch itself, the self-update redirect, later offline work —
  # is what each sync re-applies onto the official tree.
  PATCH_SHA: ef517b80b8d58d3131ad0f879bf62f737ac600ee
  # This repository's release key (crates/horizon-release-sign/release-keys.txt
  # line): a synced launcher must trust it to self-update.
  OFFLINE_KEY: KryjxUnsgyWi5jwJp1jnryYqLNCjyi8X/gyuVFW82FI=

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.compare.outputs.version }}
    steps:
      - name: Official's newest launcher tag vs. ours
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          official=$(gh api "repos/$OFFICIAL_REPO/git/matching-refs/tags/launcher@?per_page=100" --paginate \
            --jq '.[].ref' | sed 's|^refs/tags/launcher@||' | sort -V | tail -n1)
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$official"; then
            echo "official repository has no usable launcher@ tag ('$official'); nothing to do"
            exit 0
          fi
          ours=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" 'refs/tags/launcher@*' \
            | sed 's|.*refs/tags/launcher@||; s/\^.*$//' | sort -V | tail -n1)
          # A synced tag without a release (a failed build) is still worth a retry:
          # only when ours is uo to date AND its release exists is there nothing to do.
          if [ "$official" = "$ours" ]; then
            if gh release view "launcher@$official" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "up to date: launcher@$official exists here; nothing to do"
              exit 0
            fi
            echo "tag launcher@$official exists without a release; retrying its build"
            echo "version=$official" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$official" "$ours" | sort -V | tail -n1)
          if [ "$newest" != "$official" ]; then
            echo "up to date: ours ($ours) is not older than official ($official); nothing to do"
            exit 0
          fi
          echo "official launcher@$official is newer than ours (${ours:-none}): syncing"
          echo "version=$official" >> "$GITHUB_OUTPUT"

  sync-source:
    needs: watch
    if: needs.watch.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the offline flavor is cherry-picked with each commit's
          # parent along, and the push reuses our history instead of growing a new one.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The official sources with the offline patch re-applied
        env:
          VERSION: ${{ needs.watch.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$VERSION"; then
            echo "refusing a non-semver launcher version: '$VERSION'" >&2
            exit 1
          fi
          tag="launcher@$VERSION"
          git fetch origin --tags
          # A retried build (the tag exists, its sync commit is on main): the sources
          # need nothing new — only the release below runs again.
          if git cat-file -e "refs/tags/$tag" 2>/dev/null &&
             git merge-base --is-ancestor "refs/tags/$tag" main &&
             [ "$(git log -1 --format=%s "refs/tags/$tag")" = "Sync: official launcher@$VERSION with the offline patch re-applied" ]; then
            echo "sources already contain $tag; only its release runs again"
            exit 0
          fi
          git config user.name "offline-sync[bot]"
          git config user.email "offline-sync[bot]@users.noreply.github.com"
          # --no-tags: the tag must not also land under its own name here (it is
          # created below, from the sync commit, not from the official one).
          git fetch --depth 1 --no-tags "https://github.com/$OFFICIAL_REPO" "refs/tags/$tag:refs/tags/official-$VERSION"
          git checkout --detach "refs/tags/official-$VERSION"
          # The whole offline flavor rides along: the patch commit and everything
          # after it on main. The range starts at PATCH_SHA's parent, because the
          # 3-way base of the patch commit is that parent — the pre-patch official
          # tree — which is exactly what "re-apply the patch" means (cherry-picking
          # only after PATCH_SHA would use the patched tree as the base and then
          # drop every file the patch adds). `-X theirs` = where our hunks and
          # upstream's disagree, ours win (the patch: things it deletes or changes
          # stay deleted or changed).
          # Where official merely changed a file the flavor deletes (its `.github`
          # workflows and design, touched again by launcher@0.2.43), `-X theirs`
          # has no say: a modify/delete fight isn't a content one, and it halts a
          # ranged pick. So the range goes commit by commit, and every file-level
          # fight is settled the way the flavor decided it: what the flavor is rid
          # of, this tree stays rid of; what the flavor keeps, ours win.
          # Past "Sync: official launcher@" commits are not flavor: their diff
          # IS the previous official change-set, and re-applying it here dragged
          # that vintage over the new one wherever the picks conflicted. The
          # same goes for "Restore the plain-official" commits: they only carry
          # plain-official content of some past tag back in, which the
          # plain-official convergence below settles anyway, right against the
          # tag being synced. Pick only real offline commits.
          for r in $(git rev-list --reverse \
                --grep '^Sync: official launcher@' \
                --grep '^Restore the plain-official' --invert-grep \
                "$PATCH_SHA^..main"); do
            git cherry-pick --quit 2>/dev/null || true
            git cherry-pick -n -X theirs "$r" || {
              code=$?
              [ "$code" -eq 1 ] || exit "$code"
              # Settle-v3: a conflicted file never takes the pick's whole old
              # vintage. The official side wins the file first, then only THIS
              # pick's own change is re-applied through a true 3-way apply
              # against what official has now. Where that cannot merge cleanly
              # the sync stops loudly: mending on main and letting the next
              # watch tick retry is the way, never a silent blend.
              for p in $(git diff --name-only --diff-filter=U); do
                if ! git cat-file -e "$r:$p" 2>/dev/null; then
                  git rm -f --quiet -- "$p"
                elif git cat-file -e "refs/tags/official-$VERSION:$p" 2>/dev/null; then
                  git checkout "refs/tags/official-$VERSION" -- "$p"
                  if ! git diff "$r^" "$r" -- "$p" | git apply -3; then
                    echo "::error::offline change to $p does not settle on official launcher@$VERSION — fix it on main (a repro commit), then the watch retries" >&2
                    echo "::error::this pick's change to $p (first-parent diff):" >&2
                    git diff "$r^" "$r" -- "$p" >&2 || true
                    exit 1
                  fi
                else
                  git checkout "$r" -- "$p"
                fi
              done
            }
          done
          git cherry-pick --quit 2>/dev/null || true
          # Plain-official convergence: the pick alone can settle a whole-file
          # conflict between a past sync commit and the official tag with the
          # old vintage (how 0.2.42's modpacks came to rest on 0.2.43). So every
          # path that never was a real offline commit's business carries the
          # official tag's exact content again: differing and missing files are
          # written from the official tree (fetched above; its blobs are all
          # local), files official dropped are removed, and owned paths keep
          # whatever the picks settled.
          promain=$(git rev-parse main)
          owned() {  # is this path a real (never a sync) offline commit's business?
            git log -1 --format=%h --grep '^Sync: official launcher@' --invert-grep \
              "$PATCH_SHA^..$promain" -- "$1" 2>/dev/null | grep -q .
          }
          tmp=$(mktemp -d)
          git ls-tree -r --format='%(path) %(objectname)' "refs/tags/official-$VERSION" > "$tmp/official.txt"
          awk '{print $1}' "$tmp/official.txt" > "$tmp/official.paths"
          declare -A OFFICIAL=()
          while read -r p sha; do OFFICIAL[$p]=$sha; done < "$tmp/official.txt"
          git ls-tree -r --format='%(path) %(objectname)' HEAD > "$tmp/ours.txt"
          declare -A OURS=()
          while read -r p sha; do OURS[$p]=$sha; done < "$tmp/ours.txt"
          for p in "${!OFFICIAL[@]}"; do
            case "$p" in .github/*|crates/horizon-release-sign/release-keys.txt) continue;; esac
            case "$p" in launcher/src/sources.rs|launcher/src/sources_tests.rs) continue;; esac
            o=${OURS[$p]:-MISSING}
            [ "$o" = "${OFFICIAL[$p]}" ] && continue
            owned "$p" && continue
            if [ "$o" = MISSING ]; then
              dir="${p%/*}"
              [ "$dir" != "$p" ] && mkdir -p "$dir"
              git cat-file blob "${OFFICIAL[$p]}" > "$p"
              git add -A -- "$p"
              echo "restored from official: $p (was missing)"
            else
              git checkout "refs/tags/official-$VERSION" -- "$p"
              echo "restored from official: $p"
            fi
          done
          for p in "${!OURS[@]}"; do
            case "$p" in .github/*|crates/horizon-release-sign/release-keys.txt) continue;; esac
            case "$p" in launcher/src/sources.rs|launcher/src/sources_tests.rs) continue;; esac
            grep -Fxq "$p" "$tmp/official.paths" && continue
            owned "$p" && continue
            [ -f "$p" ] || continue
            git rm -f --quiet -- "$p" 2>/dev/null || rm -f -- "$p"
            echo "removed (official has no such file): $p"
          done
          unset OFFICIAL OURS
          rm -rf "$tmp"
          # Our CI files, not the official tag's: sync builds only ever run ours.
          rm -rf .github
          git checkout main -- .github
          # The launcher inside the synced sources must trust this repository's
          # key to self-update: the official tag's list with our line appended.
          git checkout "refs/tags/official-$VERSION" -- crates/horizon-release-sign/release-keys.txt
          grep -qF "$OFFLINE_KEY" crates/horizon-release-sign/release-keys.txt || cat >> crates/horizon-release-sign/release-keys.txt <<KEYS
          # OFFLINE: the offline launcher's own key (ItzJoker2YT-city/horizon-offline-official), signs this repo's launcher releases.
          $OFFLINE_KEY
          KEYS
          git add -A
          git reset --soft main
          if git diff --cached --quiet; then
            # This official version is already on main, with the patch: a retry
            # (a build failed before), or its tag was removed since. There is
            # nothing to commit — main's tree is what the tag points at, and
            # what the release below builds.
            echo "nothing to sync: launcher@$VERSION is already on main"
          else
            # Settle-v3 gate: the synced tree type-checks BEFORE anything is
            # committed or tagged. A mechanical blend that no longer compiles
            # (a rewritten official file under an offline edit) refuses to
            # touch this repository at all: main keeps its last green tree,
            # the watch retries after a fix lands on main. The check runs on
            # the Linux runner — the platform whose cfg-only failures other
            # runners cannot see (the launcher@0.2.49 lesson).
            if ! cargo check --locked > "$PWD/.sync-cargo-check.log" 2>&1; then
              echo "type-check FAILED; nothing was committed, tagged or pushed:" >&2
              tail -n 120 "$PWD/.sync-cargo-check.log" >&2 || true
              rm -f "$PWD/.sync-cargo-check.log"
              git reset --hard main
              exit 1
            fi
            rm -f "$PWD/.sync-cargo-check.log"
            git commit -m "Sync: official launcher@$VERSION with the offline patch re-applied"
            git push origin HEAD:main
          fi
          # -f: a matching tag from `git fetch --tags` above must not block it,
          # and a stale one from a retry must be replaced.
          git tag -f "$tag" HEAD
          git push -f origin "refs/tags/$tag"

  publish:
    needs: [watch, sync-source]
    if: needs.watch.outputs.version != ''
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      version: launcher@${{ needs.watch.outputs.version }}
      checkout_ref: launcher@${{ needs.watch.outputs.version }}
      do_release: true
    secrets: inherit
