name: release
# Builds the offline-patched Horizon launcher, and for a `launcher@<version>`
# tag publishes it. A thin caller for the reusable `build.yml`:
#
#   git push origin launcher@0.2.42                        # build + sign + release
#   gh workflow run release -f version=launcher@0.2.42     # build only, as artifacts
#
# sync.yml calls the same reusable workflow for a synced official launcher
# release with the offline patch re-applied (that is the usual origin of new
# releases here).

on:
  push:
    tags: ['launcher@*']
  workflow_dispatch:
    inputs:
      version:
        description: The `launcher@<version>` tag to build (tagged, so not for not-yet-tagged versions)
        default: 'launcher@0.2.42'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      checkout_ref: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      do_release: ${{ github.event_name == 'push' }}
    secrets: inherit
