name: build
# Reusable: builds the offline-patched Horizon launcher for Linux x86_64 (tar.gz and AppImage),
# macOS arm64 and x64 (zip and .dmg), Windows x64 and ARM64 (zip and setup exe each), and — when
# `do_release` is set — signs the assets and publishes the GitHub Release. Called by release.yml
# (tag pushes, manual artifact builds) and by sync.yml (a new official launcher release with the
# patch re-applied).
#
# The patched sources build exactly like Horizon's own release workflow does (launcher.yml
# upstream): --release --locked, the C runtime linked in on Windows, the version and tag given to
# the build via HORIZON_LAUNCHER_VERSION and HORIZON_LAUNCHER_TAG, and the packaging their
# packaging/linux and packaging/macos scripts do (this repository carries those, unchanged).
#
# Inputs:
#   version      The `launcher@<version>` tag to build and release as (required).
#   do_release   Also sign and publish the release (default: false).
#   checkout_ref The git ref to check out (default: `version`, i.e. the tag).

on:
  workflow_call:
    inputs:
      version:
        description: The `launcher@<version>` tag to build (and release) as
        required: true
        type: string
      do_release:
        description: Sign the assets and publish the release
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: The git ref to check out (defaults to `version`)
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # Test builds never reach the telemetry server.
  HORIZON_TELEMETRY_URL: "off"

jobs:
  build:
    name: build ${{ matrix.name }}
    # Windows ARM64 is new: its failure never holds the other platforms' release. The release
    # steps leave the missing ARM64 files out with a warning (the launcher then installs an
    # older one: backend.rs, launcher_update_from).
    continue-on-error: ${{ matrix.name == 'windows-arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            asset: horizon-launcher-linux-x86_64.tar.gz
            binary: horizon-launcher
          - name: macos
            mac: true
            asset: horizon-launcher-macos-arm64.zip
            binary: horizon-launcher
            mac_arch: arm64
          - name: macos-x64
            mac: true
            target: x86_64-apple-darwin
            asset: horizon-launcher-macos-x64.zip
            binary: horizon-launcher
            mac_arch: x64
          - name: windows-x64
            os: windows-latest
            asset: horizon-launcher-windows-x64.zip
            binary: horizon-launcher.exe
            pe_arch: x64
            setup_asset: horizon-launcher-setup.exe
            # The C runtime linked in: without it the launcher asks for VCRUNTIME140.dll,
            # which only the Visual C++ redistributable installs.
            rustflags: -C target-feature=+crt-static
          - name: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            asset: horizon-launcher-windows-arm64.zip
            binary: horizon-launcher.exe
            pe_arch: arm64
            setup_asset: horizon-launcher-setup-arm64.exe
            # The C runtime linked in, so the standalone ARM64 launcher needs no redistributable.
            rustflags: -C target-feature=+crt-static
    # macOS: a GitHub-hosted runner (macos-latest) unless a repository variable MAC_RUNNER says
    # otherwise; Intel is cross-built for x86_64-apple-darwin on the same runner.
    runs-on: ${{ matrix.mac && (vars.MAC_RUNNER || 'macos-latest') || matrix.os }}
    timeout-minutes: ${{ matrix.mac && 60 || 90 }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # Where cargo puts the launcher: target/release, or target/<target>/release when built
      # for another target (Intel Mac, Windows ARM64).
      BIN: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # A sync builds the just-pushed sources instead of the caller run's commit.
          ref: ${{ inputs.checkout_ref || inputs.version }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-${{ matrix.name }}
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf
      - name: Metal shaders compiled now, or at run time without the Metal toolchain
        # GPUI compiles its Metal shaders when it builds; a runner without the Metal toolchain
        # (xcodebuild -downloadComponent MetalToolchain) gets them compiled when the launcher
        # starts, through gpui_platform/runtime_shaders.
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version > /dev/null 2>&1; then
            echo "::notice::No Metal toolchain on this runner: GPUI compiles its shaders at run time"
            echo "LAUNCHER_FEATURES=gpui_platform/runtime_shaders" >> "$GITHUB_ENV"
          fi
      - name: The launcher version (the `launcher@` tag)
        run: |
          version="${{ inputs.version }}"
          if ! grep -qE '^launcher@[0-9]+\.[0-9]+\.[0-9]+$' <<< "$version"; then
            echo "::error:not a launcher@<semver> tag: '$(printf '%s' "$version" | head -c 120)'"
            exit 1
          fi
          version="${version#launcher@}"
          echo "HORIZON_LAUNCHER_VERSION=$version" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_TAG=launcher@$version" >> "$GITHUB_ENV"
      - run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"}
      - name: Verify Windows executable architecture
        if: runner.os == 'Windows'
        run: python ../tools/check_pe_arch.py "${{ matrix.pe_arch }}" "$BIN/${{ matrix.binary }}"
      - name: The version is the release's
        run: |
          "$BIN/${{ matrix.binary }}" --version
      - name: The release feed the launcher self-updates from parses
        # Warning only: a hiccup of GitHub's API must not fail an otherwise good build.
        env:
          HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
        run: |
          "$BIN/${{ matrix.binary }}" versions || echo "::warning:the feed check failed (GitHub API hiccup?)"
      - name: Package
        run: |
          rm -rf dist out && mkdir -p dist out
          version="$HORIZON_LAUNCHER_VERSION"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Horizon.app, zipped (self-update) and in a .dmg (installer), signed ad hoc (no
            # Apple identity in this repository): packaging/macos.
            python3 -m venv "$RUNNER_TEMP/dmg" && "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.5
            DMGBUILD="$RUNNER_TEMP/dmg/bin/dmgbuild" ../packaging/macos/package.sh \
              "$BIN/${{ matrix.binary }}" "$version" out ${{ matrix.mac_arch }}
            rm -rf out/Horizon.app
          else
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              # The .tar.gz below is what the launcher updates itself from; the AppImage is what
              # a player downloads and double-clicks, and it replaces itself instead
              # (packaging/linux/appimage.sh, launcher/src/backend.rs).
              ../packaging/linux/appimage.sh "$BIN/${{ matrix.binary }}" "$version" out
            fi
            cp "$BIN/${{ matrix.binary }}" dist/
            # The legal files ride along in every archive.
            cp ../LICENSE ../THIRD_PARTY_NOTICES.md ../NOTICE.txt dist/
            if [[ "${{ matrix.asset }}" == *.tar.gz ]]; then
              (cd dist && tar czf ../out/${{ matrix.asset }} .)
            else
              (cd dist && 7z a ../out/${{ matrix.asset }} . > /dev/null)
            fi
          fi
          ls -l out
      - name: Setup exe (Windows)
        # The launcher's binary under another name: started with no arguments it shows the
        # per-user installer instead of Home (launcher/src/installer.rs). Its name is what makes
        # it the setup, so the ZIP's copy stays the launcher. Both go into the release's signed
        # SHA256SUMS.
        if: runner.os == 'Windows'
        run: cp "$BIN/${{ matrix.binary }}" "out/${{ matrix.setup_asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: launcher/out/*
          retention-days: 7

  release:
    needs: build
    if: inputs.do_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # For the signing/verify tools (tools/ci/sign_release.sh, horizon-release-sign):
          # the artifacts carry everything else, so a bare checkout without a build is enough.
          ref: ${{ inputs.checkout_ref || inputs.version }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The Windows ARM64 launcher, if it built
        # Its build may fail without holding the release (continue-on-error): the release then
        # has no ARM64 files, and ARM64 launchers stay on their version until one has.
        run: |
          for file in horizon-launcher-windows-arm64.zip horizon-launcher-setup-arm64.exe; do
            [[ -f "dist/$file" ]] || echo "::warning::$file is missing: this release goes out without it"
          done
      - name: Sign the release (SHA256SUMS + SHA256SUMS.sig)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.OFFLINE_RELEASE_SIGNING_KEY }}
          TAG: ${{ inputs.version }}
        run: |
          bash tools/ci/sign_release.sh "$TAG" dist/horizon-launcher-*
      - name: Verify like the launcher would
        env:
          TAG: ${{ inputs.version }}
        run: |
          cargo run --locked -p horizon-release-sign -- verify --tag "$TAG" --publishing dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.version }}
        run: |
          version="${TAG#launcher@}"
          cat > notes.md <<BODY
          ## Horizon Offline Launcher $version

          The official [Horizon launcher](https://github.com/horizon-rust/horizon) (synced
          from its \`launcher@$version\` sources automatically) with the offline patch on
          top: it plays **without a Microsoft account**. Game versions, downloads and
          signatures still come from Horizon's own releases — nothing about the game
          itself is patched.

          ### Downloads
          - **Windows x64:** \`horizon-launcher-windows-x64.zip\` (portable), or
            \`horizon-launcher-setup.exe\` (the same launcher as a per-user installer).
          - **Windows ARM64:** \`horizon-launcher-windows-arm64.zip\`, or
            \`horizon-launcher-setup-arm64.exe\`.
          - **macOS (Apple Silicon):** \`horizon-launcher-macos-arm64.dmg\`, or
            \`horizon-launcher-macos-arm64.zip\` (the portable app).
          - **macOS (Intel):** \`horizon-launcher-macos-x64.dmg\`, or
            \`horizon-launcher-macos-x64.zip\`.
          - **Linux:** \`horizon-launcher-linux-x86_64.tar.gz\`, or the double-clickable
            \`horizon-launcher-linux-x86_64.AppImage\`.

          ### Updates keep the patch
          This launcher updates **itself** from this repository: clicking Update installs
          the offline-patched build again, never the official one. Game updates and
          Nightlies are unaffected and stay official. (Only the plain 0.2.41 install still
          read the official feed: install 0.2.42 manually once to switch.) The
          \`HORIZON_LAUNCHER_NO_SELF_UPDATE=1\` environment variable now only means
          "never update myself" — it is no longer needed to keep the patch.

          ### About the macOS and ARM64 builds
          The macOS app and .dmg are **signed ad hoc** (this repository has no Apple Developer
          identity): the first start may need a right-click → Open, or
          \`xattr -cr /Applications/Horizon.app\`. The Windows ARM64 launcher installs the
          x64 game build where a Nightly has no ARM64 one, like the official launcher does.

          ### Checksums
          \`SHA256SUMS\` lists every archive's SHA-256; \`SHA256SUMS.sig\` is its
          Ed25519 signature. The launcher verifies it before installing.

          Offline names, existing Horizon data folders and linked installs (a Minecraft
          client jar from any launcher) all keep working: the same data folder as the
          official launcher is used.

          ### Credits
          [Horizon](https://github.com/horizon-rust/horizon) (MIT) — the launcher itself;
          [gerdaroot/Horizon-Offline-Launcher](https://github.com/gerdaroot/Horizon-Offline-Launcher)
          — the offline patch this build re-applies onto the official sources. Not
          affiliated with Mojang or Microsoft.
          BODY
          assets=(dist/horizon-launcher-* dist/SHA256SUMS dist/SHA256SUMS.sig)
          if gh release view "$TAG" --json assets --jq . > /dev/null 2>&1; then
            # The release exists (a rebuild of the same version): replace its assets where the
            # file names collide and refresh the notes with this build's download list.
            gh release upload "$TAG" --clobber "${assets[@]}"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "Horizon Offline Launcher $version" \
              --notes-file notes.md "${assets[@]}"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          retention-days: 7
